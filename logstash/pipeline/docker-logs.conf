input {
  beats {
    port => 5044
  }
}

filter {
  # Extract container ID from log file path
  if [log][file][path] {
    grok {
      match => {
        "[log][file][path]" => "/var/lib/docker/containers/%{DATA:container_id}/%{GREEDYDATA}"
      }
    }
  }

  # Parse JSON logs
  if [message] =~ /^\{/ {
    json {
      source => "message"
      target => "parsed_json"
    }
  }

  # Use service name from parsed JSON if available
  if [parsed_json][service][name] {
    mutate {
      add_field => { "service_name" => "%{[parsed_json][service][name]}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "docker-logs-%{+YYYY.MM.dd}"
  }
}
