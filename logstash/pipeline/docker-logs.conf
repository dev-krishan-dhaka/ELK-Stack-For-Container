input {
  beats {
    port => 5044
  }
}

filter {
  # Step 1: Extract container_id from log file path
  if [log][file][path] {
    grok {
      match => {
        "[log][file][path]" => "/var/lib/docker/containers/%{DATA:container_id}/%{GREEDYDATA}"
      }
    }
  }

  # Step 2: Use Ruby to call Docker API and get container name
  if [container_id] {
    ruby {
      code => '
        require "net/http"
        require "socket"
        require "json"

        container_id = event.get("container_id")
        begin
          socket = UNIXSocket.new("/var/run/docker.sock")
          request = "GET /containers/#{container_id}/json HTTP/1.0\r\nHost: localhost\r\n\r\n"
          socket.write(request)
          response = socket.read
          socket.close

          body = response.split("\r\n\r\n", 2)[1]
          if body
            data = JSON.parse(body)
            event.set("container_name", data["Name"].to_s.gsub("/", ""))
            event.set("container_image", data["Config"]["Image"].to_s)
          end
        rescue => e
          event.set("container_name", "unknown")
          event.set("container_image", "unknown")
        end
      '
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "docker-logs-%{+YYYY.MM.dd}"
  }
}
